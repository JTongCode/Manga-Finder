<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bulma.min.css" />
</head>

<body>
    <div class="container p-3">
        <h1 class="title">Manger Finder</h1>

        <div class="field">
            <label class="label">Status</label>
            <span id="running" class="tag is-success">Running</span>
            <span id="stopped" class="tag is-danger">Stopped</span>
        </div>
    </div>

    <div class="containter p-3">
        <div class="field">
            <input class="input" type="text" placeholder="Title" id="title">
        </div>

        <div class="field">
            <input class="input" type="text" placeholder="Chapter Number" id="chapter">
        </div>
    </div>


    <div class="containter p-3">
        <div class="field">
            <label class="label">Language</label>
            <div class="select">
                <select id="language">
                    <option value="">Select a language</option>
                    <option value="en">English</option>
                    <option value="jp">Japanese</option>
                    <option value="kr">Korean</option>
                    <option value="ch">Chinese</option>
                </select>
            </div>
        </div>
    </div>

    <div class="containter p-3">
        <div class="field">
           <label class="label">Links</label> 
           <div class="select">
                <select id="linkDropdown" onchange="location = this.value;"></select>
                    <option value="">Select a Link</option>
           </div>
        </div>
    </div>

    <div class="container p-3">
        <button class="button is-success is-fullwidth" id="startButton">Start</button>
    </div>

    <div class="container p-3">
        <button class="button is-danger is-fullwidth" id="stopButton">Stop</button>
    </div>

</body>

<script src="popup.js"></script>

</html>
